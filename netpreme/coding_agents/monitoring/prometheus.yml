global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  # vLLM + Dynamo frontend metrics: TTFT, ITL, e2e latency, scheduler, cache, token throughput
  # Exposes both vllm:* and dynamo_component_router_* metrics
  - job_name: vllm_frontend
    static_configs:
      - targets: ["localhost:8000"]
    metrics_path: /metrics

  # vLLM worker metrics: vllm:* and dynamo_component_* from the backend process
  # Requires DYN_SYSTEM_PORT=8081 set on the dynamo.vllm worker (see launch_dynamo.sh)
  - job_name: vllm_worker
    static_configs:
      - targets: ["localhost:8081"]
    metrics_path: /metrics

  # Per-GPU utilization, memory, power, temp (from nvidia-smi)
  - job_name: gpu_exporter
    static_configs:
      - targets: ["localhost:9092"]

  # ── Sweep: mtier on :8001, cpu on :8002 (setup label on each) ────
  - job_name: vllm_hybrid_mtier
    static_configs:
      - targets: ["localhost:8001"]
        labels:
          setup: "hybrid-mtier"
    metrics_path: /metrics

  - job_name: vllm_hybrid_cpu
    static_configs:
      - targets: ["localhost:8002"]
        labels:
          setup: "hybrid-cpu"
    metrics_path: /metrics
